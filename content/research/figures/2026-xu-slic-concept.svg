<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">SLIC: a small language model iteratively optimizing an analog circuit</title>
<desc id="d">A small glowing model cube on the left exchanges three luminous loops with a glass panel on the right that shows a five-transistor operational transconductance amplifier schematic; behind it, frequency-response curves approach a dashed target over successive turns.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#161b26"/><stop offset="0.55" stop-color="#0b0e15"/><stop offset="1" stop-color="#050609"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.16"/><stop offset="1" stop-color="#3a5f9a" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.08"/><stop offset="1" stop-color="#3a5f9a" stop-opacity="0.02"/>
  </linearGradient>
  <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5fb2ff" stop-opacity="0.55"/><stop offset="1" stop-color="#1d5fb0" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="cubeL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1f62b8" stop-opacity="0.45"/><stop offset="1" stop-color="#0a2a55" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="cubeR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#174d94" stop-opacity="0.5"/><stop offset="1" stop-color="#061c3c" stop-opacity="0.4"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#e8f4ff"/><stop offset="0.35" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2a7fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="pool"><stop offset="0" stop-color="#3d8bff" stop-opacity="0.35"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/></radialGradient>
  <radialGradient id="poolR"><stop offset="0" stop-color="#ff3b4f" stop-opacity="0.22"/><stop offset="1" stop-color="#ff3b4f" stop-opacity="0"/></radialGradient>
  <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="floorMask"><rect x="0" y="600" width="1600" height="300" fill="url(#floorFade)"/></mask>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
